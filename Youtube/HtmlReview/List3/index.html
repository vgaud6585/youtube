<!DOCTYPE html>
<html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    
  </head>
  <body>
    <h1>Unorder List Creat</h1>
    <ul>
      <li>Apple</li>
      <li>Mango</li>
      <li>Grapes</li>
      <li>Banana</li>
      <li>Watermelon</li>
    </ul>
    
    <h1>Order List Creat</h1>
    <ol>
      <li>Apple</li>
      <li>Mango</li>
      <li>Grapes</li>
      <li>Banana</li>
      <li>Watermelon</li>
    </ol>
  </body>
