<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
  </head>
  <body>
    <h1>Basic HTML Form</h1>
    <form action="" method="get" accept-charset="utf-8">
      
      <!-- Radio Buttons Group -->
      <p><strong>Gender:</strong></p>
      <input type="radio" name="gender" id="male" value="male" />
      <label for="male">Male</label>

      <input type="radio" name="gender" id="female" value="female" />
      <label for="female">Female</label>

      <input type="radio" name="gender" id="transgender" value="transgender" />
      <label for="transgender">Transgender</label>
      
      <br /><br />

      <!-- Checkboxes Group -->
      <p><strong>Hobbies:</strong></p>
      <input type="checkbox" name="hobby" id="cricket" value="cricket" />
      <label for="cricket">Cricket</label>

      <input type="checkbox" name="hobby" id="football" value="football" />
      <label for="football">Football</label>

      <input type="checkbox" name="hobby" id="hockey" value="hockey" />
      <label for="hockey">Hockey</label>
      
      <br /><br />
      
      <label for="colorpiker">Chose Color : </label>
      <input type="color" name="colorpiker" id="colorpiker" value="ff0000" />
      
      <br /><br />
      
      <input type="submit" name="save" id="save" value="Submit !!" />

    </form>
  </body>
</html>
