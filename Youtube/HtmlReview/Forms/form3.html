<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    
  </head>
  <body>
    <h1>Form part 3 </h1>
    
    <form action="" method="get" accept-charset="utf-8">
      <label for="city">Select City: </label>
      <select name="city" id="city">
          <option value="delhi">Delhi</option>
          <option value="mumbai">Mumbai</option>
          <option value="kolkata">Kolkata</option>
      </select>
      <br /><br />
      
      <label for="message">Apna Message Likhein: </label><br>
      <textarea name="message" id="message" rows="4" cols="30" placeholder="Yahan type karein..."></textarea>
      <br /><br />
      
      <label for="vol">Volume (0 to 100): </label>
      <input type="range" name="vol" id="vol" min="0" max="100">
      <br /><br />
      
      <fieldset>
      <legend>Personal Information</legend>
      <!-- Yahan aap apne naam ya email wale inputs rakh sakte hain -->
      <label for="name">Name : </label>
      <input type="text" name="name" id="name" value="" /><br /><br />
      
      <label for="em">Email : </label>
      <input type="email" name="em" id=em value="" /><br /><br />
      
      </fieldset>
      <br /><br />
      
      
      
    </form>
  </body>
</html>
