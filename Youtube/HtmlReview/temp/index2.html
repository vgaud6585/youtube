<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Datalist Example</title>
</head>
<body>

    <h2>Apni Pasanida Programming Language Chuniye:</h2>

    <!-- Input tag me 'list' attribute use karein -->
    <label for="browser">Language:</label>
    <input list="languages" name="language" id="browser" placeholder="Type or select...">

    <!-- Datalist tag jisme options define hain -->
    <datalist id="languages">
        <option value="JavaScript">
        <option value="Python">
        <option value="Java">
        <option value="C++">
        <option value="PHP">
    </datalist>

</body>
</html>
