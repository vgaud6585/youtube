<!DOCTYPE html>
<html>
<head>
    <title>HTML Text Formatting Example</title>
</head>
<body>

    <h2>Text Formatting Tags Examples</h2>

    <p>Ye <b>Bold Text</b> hai.</p>
    <p>Ye <strong>Important Bold Text</strong> hai.</p>
    <p>Ye <i>Italic Text</i> hai.</p>
    <p>Ye <em>Emphasized Text</em> hai.</p>
    <p>Ye <u>Underlined Text</u> hai.</p>
    <p>Ye <mark>Highlighted Text</mark> hai.</p>
    <p>Ye <small>Chhota Text</small> hai.</p>
    <p>Purana price: <del>₹500</del>, Naya price: <ins>₹300</ins>.</p>
    <p>Water ka formula: H<sub>2</sub>O</p>
    <p>Math equation: (A + B)<sup>2</sup></p>

</body>
</html>
