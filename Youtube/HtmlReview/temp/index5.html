<form action="/server-script" method="POST" enctype="multipart/form-data">
  
  <fieldset>
    <legend>Personal Details</legend>

    <label for="fname">Full Name:</label>
    <input type="text" id="fname" name="fullname" placeholder="John Doe" required>

    <label for="uemail">Email:</label>
    <input type="email" id="uemail" name="email" required>

    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male"> Male
    <input type="radio" id="female" name="gender" value="female"> Female

  </fieldset>

  <fieldset>
    <legend>Preferences & Upload</legend>

    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="in">India</option>
      <option value="us">USA</option>
    </select>

    <label for="bio">Bio:</label>
    <textarea id="bio" name="bio" rows="4" cols="30"></textarea>

    <label for="resume">Upload Resume:</label>
    <input type="file" id="resume" name="resume">

  </fieldset>

  <br>
  <button type="submit">Register</button>
  <button type="reset">Clear Form</button>

</form>
