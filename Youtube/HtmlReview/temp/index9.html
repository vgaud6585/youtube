<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Joker Image Form Example</title>
</head>
<body>

    <h2>Login Form</h2>
    
    <form action="login_process.php" method="POST">
        
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required /><br /><br />
        
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required /><br /><br />
        
        <!-- Online Joker Image Submit Button -->
        <input type="image" src="https://cdn-icons-png.flaticon.com/512/3665/3665935.png" alt="Joker Submit Button" width="80" />

    </form>

</body>
</html>
