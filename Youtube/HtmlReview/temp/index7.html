<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Color Picker Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            transition: background-color 0.3s ease;
        }
        .picker-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="picker-container">
        <label for="colorPicker"><strong>Apna Favorite Color Chunein:</strong></label><br><br>
        
        <!-- Main Color Input -->
        <input type="color" id="colorPicker" name="colorPicker" value="#3498db">
        
        <p>Selected Hex Code: <strong id="hexValue">#3498db</strong></p>
    </div>

    <script>
        const colorInput = document.getElementById('colorPicker');
        const hexDisplay = document.getElementById('hexValue');

        // Color change event listener
        colorInput.addEventListener('input', (e) => {
            const selectedColor = e.target.value;
            hexDisplay.textContent = selectedColor;
            document.body.style.backgroundColor = selectedColor;
        });
    </script>

</body>
</html>
