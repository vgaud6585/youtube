<!DOCTYPE html>
<html>
  <head>
    <title>Advanced Text Formatting</title>
  </head>
  <body>
    <!-- Quotations -->
    <p>Aapne suna hoga: <q>Practice makes perfect.</q></p>
    <p>BlockQuote Example:</p>
    <blockquote>Gyan hi sabse bada dhan hai.</blockquote>

    <!-- Technical / Code -->
    <p>Save karne ctrl + s ke liye <kbd>Ctrl</kbd> + <kbd>S</kbd> dabayein.</p>
    <p>JavaScript code sample: <code>console.log("Hello World");</code></p>
    
    <!-- Abbreviation & Time -->
    <p><abbr title="HyperText Markup Language">HTML</abbr> seekhna aasan hai.</p>
    <p>Aaj ki date: <time datetime="2026-09-30">30 September 2026</time></p>
  </body>
</html>
