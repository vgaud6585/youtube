<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Description List Example</title>
</head>
<body>

    <h2>Web Development Terms</h2>

    <!-- Description List start -->
    <dl>
        <!-- First Term and Definition -->
        <dt><strong>HTML</strong></dt>
        <dd>HyperText Markup Language - Web pages ka structure banane ke liye use hoti hai.</dd>

        <!-- Second Term and Definition -->
        <dt><strong>CSS</strong></dt>
        <dd>Cascading Style Sheets - Web pages ko design aur style dene ke liye use hoti hai.</dd>

        <!-- Third Term and Definition -->
        <dt><strong>JavaScript</strong></dt>
        <dd>Programming language - Web pages me interactivity add karne ke liye use hoti hai.</dd>
    </dl>

</body>
</html>
